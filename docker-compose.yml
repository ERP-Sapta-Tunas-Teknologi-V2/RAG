services:
  rag-nginx:
    image: nginx:alpine
    container_name: rag-nginx
    restart: unless-stopped
    ports:
      - "5000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - rag-app
    networks:
      - rag-network

  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-chatbot-app
    restart: unless-stopped
    expose:
      - "5000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./log:/app/log
    # Memungkinkan container mengakses host (misal Ollama di localhost host machine)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rag-network

  # (Opsional) Uncomment jika ingin menjalankan Ollama langsung di dalam Docker
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - rag-network
    # Untuk dukungan GPU NVIDIA (jika tersedia):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

networks:
  rag-network:
    driver: bridge

volumes:
  ollama_data:
